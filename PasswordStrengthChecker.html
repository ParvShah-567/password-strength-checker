<!DOCTYPE html>
<html> 

<head>
    <title>Password Strength Checker</title>
    <script src="PasswordStrengthChecker.js"></script>
    <link rel = "stylesheet" href = "PasswordStrengthChecker.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <h1>How secure is your password?</h1>
    <div class = "container">
        <div class = "user-input-box">
            <h2>Password Strength Checker</h2>
            <input type="password" id="password" placeholder="Enter password"  onkeyup="checkPasswordStrength()">
            <i class="fa-solid fa-eye-slash" id="togglePassword" onclick="togglePasswordVisibility()" ></i>
            <img id = 67 src = "67kid.png" style = "display: none; width: 100px; margin-top: 20px;">
            <p id="strengthText" >password is weak</p>
        </div>
    </div>
</body>

</html>
